name: build-savefix-core

# Builds the Bachata S4 ARM64 emulator core with the shadPS4 PR #5226 port
# (save_data backup completion callbacks), then swaps it into the official APK.
#
# Two facts drive the shape of this workflow:
#   1. The core is cross-compiled with the project's own Debian multiarch script,
#      which hardcodes CMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu -> must run in
#      a debian:trixie container, not on the Ubuntu runner directly.
#   2. The APK has no standalone `bin/shadps4-arm64`. The guest userland is one
#      stored zip at assets/runtime/runtime.zip; the core lives inside it as
#      host/shadps4-arm64-fex, and three metadata files carry its sha256.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CORE_URL: https://github.com/zenithblue-oss/shadps4-arm64.git
  CORE_REF: main
  APK_VERSION: v0.2.5
  APK_URL: https://github.com/JICA98/Bachata-S4/releases/download/v0.2.5/bachatas4-0.2.5-release.apk
  APK_SHA256: 1df49463f396df8b6f042230bdc1bb9f948b8e69894c378915920875c40ab0ee

permissions:
  contents: read

jobs:
  build:
    name: arm64 core + save_data port
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 300

    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl
          git config --global --add safe.directory '*'
          git --version

      - name: Free runner disk space
        # 40+ submodules plus cross-build objects do not fit next to the
        # preinstalled runner toolchains.
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          path: port

      - name: Clone Bachata ARM64 core (with submodules)
        run: |
          git clone --depth 1 --branch "$CORE_REF" \
            --recurse-submodules --shallow-submodules --jobs 8 \
            "$CORE_URL" core
          git -C core log -1 --format='core HEAD: %H %ci %s'

      - name: Apply save_data port
        run: bash port/scripts/apply-port.sh core

      - name: Record applied diff
        run: |
          git -C core diff --stat | tee port-applied.stat
          git -C core diff -- src/core/libraries/save_data > port-applied.diff

      - name: Install Debian cross-build dependencies
        working-directory: core
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Build arm64 core
        working-directory: core
        run: |
          bash runtime/scripts/build-shadps4-arm64.sh 2>&1 | tee ../build.log
          tail -20 ../build.log

      - name: Verify and strip produced ELF
        run: |
          bin=core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          ls -la "$bin"
          file "$bin"
          readelf -h "$bin" | grep -E 'Class|Machine'
          readelf -l "$bin" | grep -F '/lib/ld-linux-aarch64.so.1'
          cp "$bin" unstripped-copy
          aarch64-linux-gnu-strip --strip-debug "$bin"
          echo "--- after strip ---"
          ls -la "$bin" unstripped-copy
          cat core/runtime/build/shadps4-arm64-stage/needed.txt
          sha256sum "$bin" | tee shadps4-arm64.sha256

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64 out/
          cp core/runtime/build/shadps4-arm64-stage/needed.txt out/
          cp shadps4-arm64.sha256 port-applied.stat port-applied.diff build.log out/
          ls -la out

      - name: Upload patched core binary
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-arm64-savefix
          if-no-files-found: error
          path: out/

  repack-apk:
    name: Swap core into official APK
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch patched core
        uses: actions/download-artifact@v4
        with:
          name: shadps4-arm64-savefix
          path: out

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 zipalign apksigner unzip curl
          zipalign -h >/dev/null 2>&1 || true
          apksigner version

      - name: Download official APK
        run: |
          curl -sSL --retry 3 -o app.apk "$APK_URL"
          echo "$APK_SHA256  app.apk" | sha256sum -c -

      - name: Swap core inside assets/runtime/runtime.zip
        run: |
          python3 scripts/repack-runtime.py \
            app.apk out/shadps4-arm64 patched-unaligned.apk \
            --needed out/needed.txt 2>&1 | tee repack.log

      - name: Align
        run: |
          zipalign -p -f 4 patched-unaligned.apk patched-aligned.apk
          echo "--- alignment check ---"
          zipalign -c -p 4 patched-aligned.apk && echo "align OK"

      - name: Sign
        run: |
          keytool -genkeypair -keystore savefix.jks -alias savefix \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass savefix123 -keypass savefix123 \
            -dname "CN=Bachata S4 SaveFix, OU=port, O=local, C=CN" 2>/dev/null
          apksigner sign --ks savefix.jks --ks-pass pass:savefix123 \
            --key-pass pass:savefix123 --out patched.apk patched-aligned.apk
          echo "--- verify ---"
          apksigner verify --print-certs --verbose patched.apk | tee verify.log
          sha256sum patched.apk | tee patched.sha256
          ls -la patched.apk

      - name: Upload repacked APK
        uses: actions/upload-artifact@v4
        with:
          name: bachata-s4-savefix-apk
          if-no-files-found: error
          path: |
            patched.apk
            patched.sha256
            verify.log
            repack.log
